version: '3.9'

# ───────────────────────────────────────────
# Development Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ───────────────────────────────────────────

services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: flowforge-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flowforge-network

  # pgAdmin (PostgreSQL GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flowforge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flowforge.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - flowforge-network

  # Override server for dev (mount source, use nodemon)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  # Override client for dev (Vite dev server)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_WS_URL: http://localhost:4000
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: npm run dev -- --host

volumes:
  pgadmin_data:
    driver: local
